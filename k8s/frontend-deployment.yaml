apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: technova-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technova-frontend
  template:
    metadata:
      labels:
        app: technova-frontend
    spec:
      containers:
        - name: frontend
          image: dockerhub_username/technova-frontend:latest # Replace dockerhub_username with actual Docker Hub username
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
