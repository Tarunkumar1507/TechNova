version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: technova-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - technova-network
    restart: always

  backend:
    build:
      context: ./backend
    container_name: technova-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/technova
      - JWT_SECRET=supersecretjwtkey12345
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - technova-network
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
    container_name: technova-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - technova-network
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: technova-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - technova-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: technova-grafana
    ports:
      - "3000:3000"
    networks:
      - technova-network
    restart: always

volumes:
  mongodb_data:

networks:
  technova-network:
    driver: bridge
