name: TechNova CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Test Run
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      # Frontend Build Run
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # Test Docker Image Build Integrity
      - name: Build Backend Docker Image
        run: |
          docker build -t technova-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t technova-frontend:test ./frontend
